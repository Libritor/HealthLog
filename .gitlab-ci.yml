# GitLab CI/CD Pipeline

stages:
  - analyze
  - test
  - build

variables:
  FLUTTER_VERSION: "3.24.0"

.flutter_setup: &flutter_setup
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip wget xz-utils
    - wget -q https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz
    - tar xf flutter_linux_${FLUTTER_VERSION}-stable.tar.xz
    - export PATH="$PATH:$(pwd)/flutter/bin"
    - flutter doctor -v
    - flutter pub get

analyze:
  stage: analyze
  image: ubuntu:22.04
  <<: *flutter_setup
  script:
    - flutter analyze
  only:
    - merge_requests
    - main

test:
  stage: test
  image: ubuntu:22.04
  <<: *flutter_setup
  script:
    - flutter test
  only:
    - merge_requests
    - main
  allow_failure: true  # Some tests may need hardware

build_android_debug:
  stage: build
  image: ubuntu:22.04
  <<: *flutter_setup
  script:
    - apt-get install -y -qq openjdk-17-jdk
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - flutter build apk --debug
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/app-debug.apk
    expire_in: 1 week
  only:
    - main
    - tags

